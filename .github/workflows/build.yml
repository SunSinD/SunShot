name: Build SunShot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build packages
        shell: pwsh
        run: ./build/Package.ps1
      - name: Check settings and regressions
        shell: pwsh
        run: |
          dotnet run --project tests/SunShot.CoreChecks/SunShot.CoreChecks.csproj -c Release -p:Platform=x64 -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Regression/Regression.csproj -c Release -p:Platform=x64 -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check dependencies
        shell: pwsh
        run: dotnet list SunShot/ShareX.csproj package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json
      - uses: actions/upload-artifact@v7
        with:
          name: SunShot-windows-x64
          path: |
            Output/SunShot-*.exe
            Output/SunShot-*.zip
            Output/SHA256SUMS.txt
          if-no-files-found: error
